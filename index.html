<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>大乐透智能选号 V2</title><style>body{font-family:system-ui;background:#f3f6fb;color:#14233a;margin:0}.wrap{max-width:900px;margin:auto;padding:20px}header{background:#163f7a;color:white;padding:20px;border-radius:14px}section{background:white;padding:18px;margin-top:15px;border-radius:14px;box-shadow:0 2px 10px #0001}button{background:#1762bb;color:white;border:0;padding:12px 18px;border-radius:9px;cursor:pointer;margin:4px}button:disabled{opacity:.5}.balls{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.ball{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:50%;background:#d73749;color:white;font-weight:bold}.blue{background:#2379c7}.muted{color:#607087}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #eee;text-align:left}input{padding:8px;max-width:100%}</style></head><body><div class="wrap"><header><h1>大乐透智能选号 V2.1</h1><p>每期推荐5注 · 基本投注10元 · 历史统计与滚动回测</p></header><section><h2>数据状态</h2><div id="status">正在读取数据…</div><button id="refresh">重新检查更新</button><p>也可导入历史开奖 JSON 文件：<input id="upload" type="file" accept=".json"></p></section><section><h2>下期固定推荐号码</h2><p class="muted">按历史频率与分布规则固定生成。相同历史数据始终得到相同5注；不代表真实中奖概率更高。</p><p id="issueinfo" class="muted"></p><button id="copy">复制号码</button><div id="recommend"></div></section><section><h2>每期存档与命中统计</h2><div id="ledger">正在读取存档…</div></section><section><h2>历史统计</h2><div id="stats">等待数据</div></section><section><h2>滚动回测</h2><p>每一期仅使用之前已公布的开奖结果，与同样5注的随机选号对比。</p><button id="backtest">运行回测（最多100期）</button><div id="testout"></div></section><section><small>本工具只供娱乐与统计研究。大乐透开奖为随机事件，算法不能保证提高中奖概率。每期最多5注，不自动购买或追加。</small></section></div><script>
let draws=[],recommendations=[],snapshots=[];const $=x=>document.getElementById(x);const fmt=n=>String(n).padStart(2,'0');
function valid(d){return d&&/^\d{5,8}$/.test(String(d.issue))&&Array.isArray(d.f)&&Array.isArray(d.b)&&d.f.length===5&&d.b.length===2&&new Set(d.f).size===5&&new Set(d.b).size===2&&d.f.every(x=>Number.isInteger(x)&&x>=1&&x<=35)&&d.b.every(x=>Number.isInteger(x)&&x>=1&&x<=12)}
function load(obj){const a=Array.isArray(obj)?obj:obj.draws;if(!Array.isArray(a))throw Error('无 draws 数组');const filtered=a.filter(valid).sort((a,b)=>String(a.issue).localeCompare(String(b.issue)));if(filtered.length!==a.length||new Set(filtered.map(d=>d.issue)).size!==filtered.length)throw Error('数据校验失败');draws=filtered;$('status').textContent='已加载 '+draws.length+' 期；最新期号：'+(draws.at(-1)?.issue||'无')+'；数据更新：'+(obj.updated_at||'本地导入')+'；数据源：'+(obj.source||'未知');const latest=draws.at(-1);if(latest){const age=(Date.now()-new Date(latest.date+'T00:00:00+08:00').getTime())/86400000;if(age>4)$('status').textContent+='。⚠ 最新开奖日期距今超过4天，请检查自动更新任务。'}stats();generate();loadSnapshots()}
async function fetchData(){try{const r=await fetch('data/history.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);load(await r.json())}catch(e){$('status').textContent='在线数据不可用：'+e.message+'。请检查同步任务或导入有效 JSON；当前不生成未经验证的正式推荐。';generate()}}
function weights(history,key,max,mode){const a=Array(max+1).fill(1);const recent=history.slice(-60);const selected=mode==='recent'?recent:history;selected.forEach(d=>d[key].forEach(n=>a[n]++));return a}
function seeded(history){let x=2166136261;const key=history.map(d=>d.issue+':'+d.f.join(',')+':'+d.b.join(',')).join('|');for(let i=0;i<key.length;i++){x^=key.charCodeAt(i);x=Math.imul(x,16777619)}return ()=>{x^=x<<13;x^=x>>>17;x^=x<<5;return (x>>>0)/4294967296}}
function pick(max,k,weights,rng=Math.random){let pool=Array.from({length:max},(_,i)=>i+1),out=[];for(let j=0;j<k;j++){const sum=pool.reduce((s,n)=>s+weights[n],0);let x=rng()*sum,idx=0;for(;idx<pool.length-1;idx++){x-=weights[pool[idx]];if(x<=0)break}out.push(pool.splice(idx,1)[0])}return out.sort((a,b)=>a-b)}
function create(history){let out=[],seen=new Set(),rng=seeded(history);for(let i=0;i<5;i++){let mode=i%4===0?'recent':i%4===1?'long':i%4===2?'balanced':'random';let wf=mode==='random'?Array(36).fill(1):weights(history,'f',35,mode),wb=mode==='random'?Array(13).fill(1):weights(history,'b',12,mode);if(mode==='balanced'){wf=wf.map((v,n)=>n===0?0:Math.sqrt(v));wb=wb.map((v,n)=>n===0?0:Math.sqrt(v))}let f,b,key,tries=0;do{f=pick(35,5,wf,rng);b=pick(12,2,wb,rng);key=f.join('-')+'/'+b.join('-');tries++}while(seen.has(key)&&tries<30);seen.add(key);out.push({f,b,mode})}return out}
function generate(){if(!draws.length){recommendations=[];$('recommend').textContent='请先加载有效历史开奖数据';return}const expected=String(Number(draws.at(-1).issue)+1).padStart(draws.at(-1).issue.length,'0');const archived=snapshots.find(x=>x.issue===expected&&x.status==='pending');recommendations=archived?archived.picks:create(draws);$('issueinfo').textContent=(archived?'已存档固定推荐 '+expected+' 期。':'预览推荐（尚未完成服务器存档），下一期 '+expected+'。')+' '+'依据最新已开奖 '+draws.at(-1).issue+' 期的数据生成，供下一期参考。历史数据未变化时，这5注保持固定。';$('recommend').innerHTML=recommendations.map((r,i)=>'<div class="balls"><strong style="width:30px">'+(i+1)+'.</strong>'+r.f.map(n=>'<span class="ball">'+fmt(n)+'</span>').join('')+r.b.map(n=>'<span class="ball blue">'+fmt(n)+'</span>').join('')+'</div>').join('')}
async function loadSnapshots(){try{const r=await fetch('data/recommendations.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('尚无推荐存档');const data=await r.json();snapshots=data.records||[];renderLedger();generate()}catch(e){$('ledger').textContent='尚未建立正式推荐存档；请在 GitHub Actions 中运行一次更新任务。';}}
function renderLedger(){const settled=snapshots.filter(x=>x.status==='drawn');const pending=snapshots.filter(x=>x.status==='pending');const hit=settled.reduce((n,r)=>n+(r.matches||[]).filter(m=>m.front===5&&m.back===2).length,0);$('ledger').innerHTML='<p>存档期数：'+snapshots.length+'；已开奖核对：'+settled.length+' 期；一等奖完整命中：'+hit+' 注；已记录基础投入：'+(snapshots.length*10)+' 元。</p><p class="muted">中奖金额与净收益：尚未计算。必须结合当期官方奖级与浮动奖金核实，不能将命中条件直接当作实际奖金。</p>'+snapshots.slice(-10).reverse().map(r=>'<p>第 '+r.issue+' 期：'+(r.status==='pending'?'等待开奖':'已核对 '+r.matches.map(m=>m.front+'+'+m.back).join('、'))+'</p>').join('')}
function stats(){if(!draws.length){$('stats').textContent='尚无历史数据';return}let f=Array(36).fill(0),b=Array(13).fill(0);draws.forEach(d=>{d.f.forEach(n=>f[n]++);d.b.forEach(n=>b[n]++)});let rank=(a)=>a.map((v,n)=>({n,v})).slice(1).sort((x,y)=>y.v-x.v).slice(0,10).map(x=>fmt(x.n)+'（'+x.v+'）').join('、');$('stats').innerHTML='<p>前区高频：'+rank(f)+'</p><p>后区高频：'+rank(b)+'</p>'}
function score(sets,draw){let wins=0,any=0;sets.forEach(s=>{const f=s.f.filter(x=>draw.f.includes(x)).length,b=s.b.filter(x=>draw.b.includes(x)).length;if(f===5&&b===2)wins++;if(f>=3||b===2)any++});return {wins,any}}
function backtest(){if(draws.length<31){$('testout').textContent='至少需要31期历史数据';return}let start=Math.max(30,draws.length-100),a=0,b=0,aw=0,bw=0;for(let i=start;i<draws.length;i++){const h=draws.slice(0,i),x=score(create(h),draws[i]),y=score(Array.from({length:5},()=>({f:pick(35,5,Array(36).fill(1)),b:pick(12,2,Array(13).fill(1))})),draws[i]);a+=x.any;b+=y.any;aw+=x.wins;bw+=y.wins}$('testout').textContent='回测 '+(draws.length-start)+' 期；策略符合简单命中条件次数：'+a+'，随机基线：'+b+'；全部号码命中次数：'+aw+' vs '+bw+'。此结果不是盈利或预测能力证明。'}
$('refresh').onclick=fetchData;$('backtest').onclick=backtest;$('copy').onclick=()=>navigator.clipboard.writeText(recommendations.map((r,i)=>(i+1)+'. '+r.f.map(fmt).join(' ')+' + '+r.b.map(fmt).join(' ')).join('\n')).then(()=>alert('已复制')).catch(()=>alert('复制失败'));$('upload').onchange=async e=>{try{load(JSON.parse(await e.target.files[0].text()))}catch(err){alert(err.message)}};fetchData();
</script></body></html>

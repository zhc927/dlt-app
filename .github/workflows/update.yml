name: Update DLT history
on:
  workflow_dispatch:
  schedule:
    # Beijing 21:45, 23:15, next morning 08:15 on draw days.
    - cron: '45 13 * * 1,3,6'
    - cron: '15 15 * * 1,3,6'
    - cron: '15 0 * * 2,4,0'
permissions:
  contents: write
concurrency:
  group: dlt-history-sync
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch published draws (official and mirror)
        run: python scripts/update.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Archive picks and reconcile results
        run: node scripts/snapshot.cjs
      - name: Commit validated results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json data/recommendations.json
          if ! git diff --cached --quiet; then
            git commit -m "Update published DLT draws and recommendations"
            git push
          fi
